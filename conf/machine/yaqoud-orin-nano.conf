#@TYPE: Machine
#@NAME: Yaqoud Orin Nano (based on Jetson Orin Nano devkit)
#@DESCRIPTION: Yaqoud IVI platform on Jetson Orin Nano 8GB

# Pull in everything from the upstream devkit
require conf/machine/jetson-orin-nano-devkit.conf

# Do NOT override ROOTFSPART_SIZE_DEFAULT here. Tried bumping it to 100GB
# (107374182400) to use more of the 116.5GB eMMC directly at flash time, but
# that changes the size baked into the built rootfs ext4 image WITHOUT
# guaranteeing tegraflash actually re-creates the on-device partition table
# at the new size (depends on the exact flash mode/tooling used) -- got a
# real device into "EXT4-fs (mmcblk0p1): bad geometry: block count 26214400
# exceeds size of device (7352162 blocks)" (100GB filesystem image written
# onto a still-28GB partition -- unmountable) this way. Staying on
# meta-tegra's stock 28GiB default (conf/machine/include/orin-nano.inc),
# which is what's already proven to flash and boot correctly, and relying on
# rootfs-expand (recipes-support/rootfs-expand in meta-autoware-edge) to grow
# the partition + filesystem into the rest of the disk at first boot instead.