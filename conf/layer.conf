# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-yaqoud-ivi"
BBFILE_PATTERN_meta-yaqoud-ivi = "^${LAYERDIR}/"
# Higher than meta-flutter's flutter-layer (12) -- as the BSP/product layer,
# meta-yaqoud-ivi must win when it ships a same-named recipe (e.g.
# recipes-graphics/toyota/flutter-auto_2.0.bb, a self-contained override of
# meta-flutter's own, not a bbappend -- see flutter-ivi/docs/BUILD_IVI_HOMESCREEN.md).
BBFILE_PRIORITY_meta-yaqoud-ivi = "15"

LAYERDEPENDS_meta-yaqoud-ivi = "core flutter-layer virtualization-layer"

LAYERSERIES_COMPAT_meta-yaqoud-ivi = "wrynose"
BBPATH .= ":${LAYERDIR}/conf"

AGL_BRANCH = "master"
AGL_FEATURES:append = " aglcore"
