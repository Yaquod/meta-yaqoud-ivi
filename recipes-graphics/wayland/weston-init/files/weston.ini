[core]
backend=drm-backend.so
xwayland=false
require-input=false
pageflip-timeout=0

[output]
name=DP-1
mode=1024x600
transform=normal

[shell]
startup-animation=none

[screen-share]
command=/usr/bin/weston --backend=vnc-backend.so --vnc-tls-cert=/etc/vnc/keys/tls.crt --vnc-tls-key=/etc/vnc/keys/tls.key --shell=fullscreen-shell.so --socket=wayland-vnc
start-on-startup=true
